name: Update channel stats

on:
  schedule:
    # каждые 30 минут
    - cron: '*/30 * * * *'
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой в GitHub

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run parser
        run: python scripts/fetch_stats.py

      - name: Commit updated tgstats.json
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add tgstats.json
          git diff --staged --quiet || git commit -m "chore: update channel stats"
          git push
